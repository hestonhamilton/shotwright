name: V 746.62 upload policy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v-746-62:
    uses: ./.github/workflows/shotwright.yml
    with:
      mode: self
      config-path: demo/shots.config.ts
      artifact-name: v-746-62-${{ github.event_name }}
      upload: ${{ github.event_name == 'pull_request' && 'on-failure' || 'always' }}
      retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}
