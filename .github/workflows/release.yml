# Release — the only workflow in this repo that can perform an irreversible act.
#
# Design notes that are load-bearing (docs/shotwright-746.18.2-plan.md):
#
#  * workflow_dispatch ONLY, and dry-run defaults to true. Reaching a real
#    publish takes a deliberate input change, not a merge.
#  * No credential input. No NODE_AUTH_TOKEN, no secrets.NPM_TOKEN. Publishing
#    is via trusted publishing (OIDC), which is why the publish job holds
#    id-token: write. If you find yourself adding a token, stop: that is a
#    design reversal and wants an ADR, not a commit.
#  * TWO JOBS, and the split is the security boundary (shotwright-746.18.27,
#    audit finding C1). id-token: write used to be granted at workflow level,
#    so every step — pnpm install and the ~250 dev packages it runs, the
#    Playwright browser download, the curl-installed scanners, verify.sh — could
#    mint an npm-audience OIDC token and publish as this repository.
#      - `build` holds contents: read and nothing else. It runs every check,
#        packs the tarball once, scans it, and hands the tarball plus its
#        sha256 to `publish` as a run artifact and as job outputs.
#      - `publish` holds id-token: write at JOB level, runs no repository
#        code (no checkout, no pnpm install, no cache), re-hashes the artifact
#        against the hash `build` reported, and runs exactly one npm publish.
#        It runs in the `npm-publish` GitHub Environment, and npm's trusted
#        publisher is registered against that environment, so a token minted
#        anywhere else is refused by the registry.
#  * The tarball is packed ONCE, scanned, and that same file is published.
#    Packing separately for the gate and for the publish would leave the gate
#    scanning bytes that are merely equivalent to what ships, not identical.
#    Crossing the job boundary does not weaken this: the sha256 travels
#    through the job-output channel, separately from the artifact store, and
#    `publish` refuses a tarball whose hash disagrees.
#  * Self-hosted runners cannot do trusted publishing, so this must stay on a
#    GitHub-hosted runner. The Forgejo lane cannot be the publish lane
#    (E9.R section 1.3, ADR 0008).
#  * This workflow runs scripts/ci/verify.sh itself, even though verify.yml runs
#    the same lane on PRs and main: the publish must not depend on a status
#    computed for a different checkout, and a required status check could not
#    be configured while the repository was private (shotwright-746.20).
#  * Guards added by shotwright-746.18.22 (redteam 2): a real publish runs only
#    from refs/heads/main; the package version must agree with the dist-tag
#    (prerelease <-> next, stable <-> latest); the tarball published is the
#    filename npm pack itself reported, from a directory created fresh for it;
#    npm is pinned, not @latest, so the dry run and the real run share a tool.
#    Dry runs may still be dispatched from a branch — that is how a change to
#    this file gets rehearsed before it reaches main. A dry run runs `build` in
#    full and skips `publish`.
#  * The main-only step is defence in depth, NOT the control. A dispatch from a
#    branch runs that branch's copy of this file, so a branch can simply delete
#    the step. The real control is the `npm-publish` environment's
#    deployment-branch policy (main only, required reviewer), which lives in
#    repository settings where a branch cannot edit it, together with the
#    --environment on the npm trusted-publisher registration
#    (docs/release-runbook.md section 1.3).
#  * No dependency cache anywhere in this workflow (audit finding C10). The
#    pnpm store cache is written by other workflows' runs; a release should
#    install from the registry against the lockfile's integrity hashes rather
#    than trust a store some other run produced. Releases are rare, so the
#    minute it costs is irrelevant. `publish` has nothing to cache at all.

name: Release

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag. Use 'next' for any prerelease — do not rely on npm's implicit guard."
        required: true
        type: string
        default: latest
      dry-run:
        description: 'Rehearse everything short of publishing. Untick only when you intend to publish.'
        required: true
        type: boolean
        default: true

# Workflow-level default: nothing. Each job states exactly what it holds, so a
# job added later starts with no permissions rather than inheriting id-token.
permissions: {}

# Two dispatches racing is the one way the irreversible command could run twice.
# Cancellation is OFF on purpose: interrupting a publish mid-flight is worse than
# making the second run wait.
concurrency:
  group: release
  cancel-in-progress: false

# actions/setup-node's bundled npm is not guaranteed to clear the 11.5.1 floor
# that trusted publishing requires, and a stale npm fails with a misleading 404
# rather than a version error (E9.R sections 1.3, 1.4). Pinned, not @latest: the
# September dry run upgraded to 12.0.2 and the next dispatch would have taken
# whatever was current, so the rehearsal and the real publish could run
# different npm versions on the same SHA. Bump deliberately, with a dry run,
# like any other pin. Trusted publishing needs >= 11.5.1.
#
# Integrity-pinned, not just version-pinned (shotwright-746.18.27): both jobs
# fetch the registry tarball and check it against this sha512 before installing
# it, so the `publish` job's only executable dependency beyond Node itself is a
# file whose bytes are fixed here. The value is the hex form of the registry's
# dist.integrity for this version; to bump, take it from
#   npm view npm@<version> dist.integrity
# (base64-decode it to hex) and confirm against a downloaded tarball.
# npm bundles all of its dependencies, so --offline install from the tarball
# fetches nothing else, and --ignore-scripts runs none of its lifecycle scripts.
env:
  NPM_PIN_VERSION: 12.2.0
  NPM_PIN_SHA512: 66c2632a94e796649738b2d7894d710c2cc2e1696893823066687f6b0d8a52e5f2b54eeaeaa32ffdc513ecca1e49ff794a5c2ec3f9515d879f1b3182b291cf35

jobs:
  build:
    name: Build, verify and pack
    runs-on: ubuntu-latest
    # Read-only. This job runs every third-party install in the workflow, so
    # it must not be able to mint an OIDC token or write to the repository.
    permissions:
      contents: read
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      # persist-credentials: false (audit finding C5). Nothing here pushes, so
      # nothing needs the GITHUB_TOKEN left in .git/config for every later step
      # — including the installs — to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # NO registry-url. When it is set, actions/setup-node unconditionally
      # writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an
      # .npmrc and exports an empty NODE_AUTH_TOKEN — which breaks trusted
      # publishing and surfaces as a bare 404, not as an auth error.
      # See actions/setup-node#1551.
      #
      # Found by the first dry-run of this workflow: the job env showed
      # NODE_AUTH_TOKEN set, directly contradicting this file's own claim to
      # carry no credential. registry.npmjs.org is npm's default, so dropping
      # the input costs nothing.
      #
      # NO cache, and package-manager-cache is off explicitly so that a future
      # packageManager field cannot switch caching back on (header, C10).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # Same pin and same install as the publish job (see the workflow env),
      # so `npm pack` here and `npm publish` there run the same npm.
      - name: Install the pinned npm
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/npm-$NPM_PIN_VERSION.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_PIN_VERSION.tgz"
          echo "$NPM_PIN_SHA512  $tgz" | sha512sum -c -
          npm install -g --ignore-scripts --offline "$tgz"
          installed="$(npm --version)"
          [ "$installed" = "$NPM_PIN_VERSION" ] || { echo "release: expected npm $NPM_PIN_VERSION, got $installed" >&2; exit 1; }
          echo "release: npm $installed"

      # The runbook says 'next for anything with a prerelease suffix'; this is
      # the check, so the checklist is not the only control. npm would happily
      # put 0.1.0 under next or 0.1.0-rc.1 under latest.
      - name: Check the package version against the dist-tag
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) prerelease=1 ;;
            *)   prerelease=0 ;;
          esac
          if [ "$prerelease" -eq 1 ] && [ "$DIST_TAG" = 'latest' ]; then
            echo "release: $version is a prerelease and must not be published to latest" >&2
            exit 1
          fi
          if [ "$prerelease" -eq 0 ] && [ "$DIST_TAG" != 'latest' ]; then
            echo "release: $version is a stable version; dist-tag must be latest, got '$DIST_TAG'" >&2
            exit 1
          fi
          echo "release: version $version -> dist-tag $DIST_TAG"

      - run: pnpm install --frozen-lockfile

      # The unit suite is not browser-free: test/unit/gallery-browser.test.ts
      # launches headless Chromium.
      - name: Install Chromium for the browser-backed unit tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Install pinned security tools
        run: |
          scripts/ci/install-gitleaks.sh "$HOME/.local/bin"
          scripts/ci/install-osv-scanner.sh "$HOME/.local/bin"

      - name: Add the security-tool install dir to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # verify.sh runs install, typecheck, lint and the unit suite — and, since
      # shotwright-746.18.3, the leak gate against its own packed tarball.
      - name: Verify
        run: scripts/ci/verify.sh

      # The reviewable record of exactly what ships, in the run log, before
      # anything leaves the runner.
      - name: Show the packed file set
        run: npm pack --dry-run

      - name: Pack the release tarball
        id: pack
        run: |
          set -euo pipefail
          # Fresh directory, and the filename comes from npm pack's own JSON:
          # the previous `find ... -print -quit` would have picked up any
          # pre-existing .tgz in the directory ahead of the one just packed
          # (redteam 2, 2026-10-05).
          #
          # The JSON shape differs by npm major — 11 emits an array of
          # results, 12 emits an object keyed by package name (measured
          # 2026-10-05: the first dry run on npm 12.2.0 failed here with
          # 'got undefined'). Both are normalised to a list before the
          # exactly-one assertion.
          rm -rf release-artifact
          mkdir release-artifact
          filename="$(npm pack --pack-destination release-artifact --json \
            | node -p "const d = JSON.parse(require('fs').readFileSync(0, 'utf8')); const r = Array.isArray(d) ? d : Object.values(d); if (r.length !== 1 || !r[0].filename) throw new Error('expected exactly one tarball with a filename, got ' + JSON.stringify(d).slice(0, 200)); r[0].filename")"
          tarball="release-artifact/$filename"
          [ -f "$tarball" ] || { echo "npm pack reported $filename but it is not there" >&2; exit 1; }
          # The hash that travels to the publish job. Written beside the
          # tarball in sha256sum's own format (bare filename, so `sha256sum -c`
          # works from inside the downloaded directory) AND exposed as a job
          # output. The publish job trusts the job output, not the file: the
          # file rides in the same artifact as the tarball, so it can only
          # catch corruption, never substitution.
          sha256="$(cd release-artifact && sha256sum "$filename" | tee "$filename.sha256" | cut -d' ' -f1)"
          # ABSOLUTE path, and this matters. npm's spec parser reads a bare
          # relative path containing a slash as GitHub shorthand: passing
          # `release-artifact/shotwright-0.1.0.tgz` made it try to fetch
          # `github:release-artifact/shotwright-0.1.0.tgz` and fail EALLOWGIT.
          # Found by the second dry run; it would have hit the real publish
          # identically.
          tarball="$(realpath "$tarball")"
          {
            echo "tarball=$tarball"
            echo "tarball-name=$filename"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "Packed $tarball (sha256 $sha256)"

      # Scans the exact file that the publish job uploads.
      - name: Leak gate
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/ci/leak-gate.sh "$TARBALL"

      # Runs on every dispatch, dry or not: it is the last check that can
      # happen without a credential, and on a real run it fails before the
      # publish job asks anyone for approval. No --provenance: provenance needs
      # the OIDC token, which this job deliberately cannot mint.
      - name: Publish (dry run)
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          echo 'DRY RUN — nothing is uploaded.'
          echo 'Not exercised by this path: the publish job itself (artifact'
          echo 'download, hash check, environment approval), registry acceptance'
          echo 'of the OIDC credential, provenance generation, and'
          echo 'installability. Those cannot be rehearsed short of publishing'
          echo '(plan section 4).'
          npm publish "$TARBALL" --tag "$DIST_TAG" --access public --dry-run

      # The tarball and its .sha256 — nothing else is in release-artifact/.
      # Uploaded on dry runs too, so a rehearsal leaves the exact bytes that a
      # real run would have published available for inspection.
      - name: Upload the release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # The environment is the control a branch cannot edit: its deployment-
    # branch policy admits only main and it requires a reviewer. npm's trusted
    # publisher is registered with --environment npm-publish, so the OIDC token
    # minted here is the only one the registry accepts. CAUTION: GitHub
    # silently creates a referenced environment that does not exist, with NO
    # protection rules. The environment must therefore be created and
    # configured before the first real dispatch (runbook section 1.3), or this
    # job runs unguarded by anything but the in-file main check.
    environment: npm-publish
    # The ONLY place id-token: write appears. No contents permission: this job
    # never checks out the repository.
    permissions:
      id-token: write

    steps:
      # Defence in depth only — see the header. On a branch dispatch the branch
      # supplies this file, so it can remove this step; the environment policy
      # above is what actually holds.
      - name: Refuse a real publish from anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "release: refusing to publish from $REF — only refs/heads/main may reach the publish step" >&2
            exit 1
          fi
          echo "release: ref is $REF"

      # Node for npm, nothing else. NO registry-url (see the build job and
      # actions/setup-node#1551) and NO cache: there is no checkout here, so
      # there is nothing to key a cache on, and nothing should be restored into
      # the job that holds the token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # Identical to the build job's step; the pin lives in the workflow env.
      - name: Install the pinned npm
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/npm-$NPM_PIN_VERSION.tgz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            -o "$tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_PIN_VERSION.tgz"
          echo "$NPM_PIN_SHA512  $tgz" | sha512sum -c -
          npm install -g --ignore-scripts --offline "$tgz"
          installed="$(npm --version)"
          [ "$installed" = "$NPM_PIN_VERSION" ] || { echo "release: expected npm $NPM_PIN_VERSION, got $installed" >&2; exit 1; }
          echo "release: npm $installed"

      - name: Download the release tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release-artifact

      # The build job's hash arrives through its job outputs, not through the
      # artifact, so swapping the tarball in the artifact store is not enough
      # to get different bytes published. Mismatch is fatal.
      - name: Check the tarball against the build job's hash
        id: check
        env:
          NAME: ${{ needs.build.outputs.tarball-name }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$NAME" =~ ^shotwright-[0-9A-Za-z.+-]+\.tgz$ ]] || { echo "release: unexpected tarball name '$NAME'" >&2; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "release: build job reported no usable sha256" >&2; exit 1; }
          cd release-artifact
          # Exactly the tarball and its hash file — nothing else rode along.
          listing="$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          wanted="$(printf '%s\n%s\n' "$NAME" "$NAME.sha256" | LC_ALL=C sort)"
          [ "$listing" = "$wanted" ] || { printf 'release: artifact contents differ from expected:\n%s\n' "$listing" >&2; exit 1; }
          sha256sum -c "$NAME.sha256"
          actual="$(sha256sum "$NAME" | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "release: sha256 mismatch for $NAME — build reported $EXPECTED, downloaded $actual" >&2
            exit 1
          fi
          echo "release: $NAME sha256 $actual matches the build job"
          # Absolute, for the same EALLOWGIT reason as in the build job.
          echo "tarball=$(realpath "$NAME")" >> "$GITHUB_OUTPUT"

      # THE IRREVERSIBLE COMMAND. Everything above this step can be undone.
      # A version number consumed here can never be reused, even after an
      # unpublish (E9.R section 2.1).
      #
      # --provenance is explicit rather than relied on as a trusted-publishing
      # default (shotwright-746.18.7 tracks whether the default alone suffices).
      - name: Publish
        env:
          TARBALL: ${{ steps.check.outputs.tarball }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"
