name: Shotwright

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  shotwright:
    # Keep this release tag aligned with the installed shotwright npm version.
    # The version command updates this pin when shotwright is released.
    uses: hestonhamilton/shotwright/.github/workflows/shotwright.yml@v0.1.1
    with:
      mode: consumer
      config-path: shots.config.ts
      working-directory: .
      package-manager: pnpm
      # Traces can include credentials; recording is off by default.
      traces: false
    # Caller env does not cross a reusable-workflow boundary. Map the named
    # SHOTWRIGHT_BASE_URL / USERNAME / PASSWORD secrets explicitly, or use
    # secrets: inherit when the repository trust boundary permits it.
    # secrets: inherit
