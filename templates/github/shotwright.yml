name: Shotwright

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  shotwright:
    # Pin to the release tag matching the installed shotwright npm version.
    # A branch such as @main could change your CI on every upstream push.
    # A workflow ref pins only that file; actions it calls could still move.
    # Shotwright SHA-pins those actions, making this release pin meaningful.
    # Update the tag when you upgrade the package.
    uses: hestonhamilton/shotwright/.github/workflows/shotwright.yml@v0.2.0
    with:
      mode: consumer
      config-path: shots.config.ts
      working-directory: .
      package-manager: pnpm
      # Traces can include credentials; recording is off by default.
      traces: false
    # Caller env does not cross a reusable-workflow boundary. Map the named
    # SHOTWRIGHT_BASE_URL / USERNAME / PASSWORD secrets explicitly, or use
    # secrets: inherit when the repository trust boundary permits it.
    # Uploaded runs include screenshots, videos, failure context, data artifacts, and optional traces;
    # they can expose anything authenticated flows displayed or fetched. Set retention-days accordingly.
    # secrets: inherit
