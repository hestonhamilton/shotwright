name: Shotwright

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  shotwright:
    # Pin to the release tag matching the installed shotwright npm version.
    # A branch such as @main could change your CI on every upstream push.
    # A workflow ref pins only that file; actions it calls could still move.
    # Shotwright SHA-pins those actions, making this release pin meaningful.
    # Update the tag when you upgrade the package.
    uses: hestonhamilton/shotwright/.github/workflows/shotwright.yml@v0.6.0
    with:
      mode: consumer
      config-path: shots.config.ts
      working-directory: .
      package-manager: pnpm
      # Traces can include credentials; recording is off by default.
      traces: false
      # Private repository Actions artifacts and Packages share included storage:
      # 500 MB on Free or 1 GB on Pro, with usage accruing by GB-hour.
      # https://docs.github.com/en/billing/concepts/product-billing/github-actions
      # PRs upload failed shot runs for 2 days; manual dispatch uploads every run for 7 days.
      # Override upload (always, on-failure, never) or retention-days as needed;
      # never leaves no GitHub run artifact.
      # Screenshots, videos, authenticated captures and optional traces can expose
      # sensitive data, including credentials in traces.
      upload: ${{ github.event_name == 'pull_request' && 'on-failure' || 'always' }}
      retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}
    # Caller env does not cross a reusable-workflow boundary. Map the named
    # SHOTWRIGHT_BASE_URL / USERNAME / PASSWORD secrets explicitly, or use
    # secrets: inherit when the repository trust boundary permits it.
    # secrets: inherit
