# scaffold.conf — project config sourced by .claude/hooks/*.sh and statusline.sh
#
# This is the executable (shell) half of the project config. The human/Claude
# half lives in the "## Project config" block of CLAUDE.md. The install script
# fills both at install time; if you edit one by hand later, mirror the change
# in the other (check by hand that they agree; nothing automates it here).

# Scaffold bundle version this config was generated from (set by install.sh).
# Recorded so drift from the bundle's VERSION can be seen by eye.
SCAFFOLD_VERSION=0.3.0

# --- Adoption mode (all hooks) ---------------------------------------------
# How forcefully the hooks enforce conventions. Lets the scaffold drop into a
# legacy repo without blocking work that predates the conventions.
#   strict = block violations (deny the tool call)            [default]
#   warn   = allow, but surface an advisory to the assistant
#   off    = silent; hooks do nothing
ENFORCEMENT=strict

# Whether this repo uses beads. "on" enables the bead-id branch check, the
# worktree guard, and the bead segment in the statusline. "off" makes the
# scaffold beads-agnostic (branch check drops the bead-id requirement; the
# statusline omits the bead segment).
BEADS=on

# --- Knowledge convention (HANDOFF / MEMORY / bd-native) --------------------
# The scaffold does not prescribe one place for durable knowledge — pick per
# project. Three independent, composable sources (use any combination):
#
#   HANDOFF.md    session-to-session handoff (current branch, next priority).
#   MEMORY.md     durable project facts that outlive a session (decisions,
#                 gotchas, invariants) — a committed, project-level file.
#   bd remember   store knowledge in beads itself (see BD_PRIME below); suits a
#                 bd-native repo that wants no committed knowledge files.
#
# HANDOFF: "on" writes HANDOFF.md at install (if absent) and the session-orient
# hook surfaces its "Next Session Priority"; "off" skips both. The
# /handoff-update and /wind-down skills stay installed but are inert without it.
HANDOFF=on

# MEMORY: "on" writes a MEMORY.md stub at install (if absent). "off" (default)
# means the scaffold neither creates nor expects one. Independent of the dial,
# the session-orient hook surfaces MEMORY.md's top facts whenever the file is
# present (same as HANDOFF.md) — so a hand-created one is picked up too.
# (Install-time behavior; not a hook-enforcement dial.)
MEMORY=off

# --- Branch convention (branch-and-bd-guard.sh, statusline.sh) -------------
# Branches must look like: <BRANCH_PREFIX><bead-id>-<kebab-slug>
BRANCH_PREFIX="feat/"

# Regex (ERE) matching a bead id at the start of the slug portion. Used to
# validate branch names and to pull the bead id out for the statusline.
# Default covers standard bd ids like "myproj-42" or "myproj-42.1".
# NOTE: the default assumes a NUMERIC suffix. bd projects with alpha/compound
# ids need an override — check `bd list` and match what it actually issues:
#   alpha/compound (e.g. "example-a1b", "example-mol-x1y2", dotted "example-3c4d.3"):
#     BEAD_ID_REGEX='example-[a-z0-9-]+(\.[0-9]+)*'
#   dotted/compound variant:
#     BEAD_ID_REGEX='(example-ab1\.[0-9]+(\.[0-9]+)?|example-[0-9]+(\.[0-9]+)?)'
BEAD_ID_REGEX='shotwright-[a-z0-9]+(\.[0-9]+)*'

# Extra branch names exempt from the convention check (ERE, may be empty).
# Base branches (main|master|develop) are always allowed.
# Use to grandfather legacy branches, e.g. "legacy-.*|hotfix-.*".
BRANCH_GRANDFATHER=''

# Worktree guard: "bd" denies `git worktree add` and steers to
# `bd worktree create` (which wires .gitignore + the shared beads DB).
# Set to "off" to allow plain `git worktree add`.
WORKTREE_GUARD=bd

# --- Session automation (session-orient.sh) --------------------------------
# Inject a compact orientation block (branch/bead/ready/handoff-priority) on a
# genuine cold start only. Set "off" to disable. Kept cheap and subagent-safe.
SESSION_ORIENT="on"

# BD_PRIME: "on" injects `bd prime` (the beads workflow primer + stored bd
# memories) into the cold-start orientation, gated the same way (BEADS=on, real
# cold start, not a subagent). Default "off": `bd prime` emits a large block and
# assumes a bd-native knowledge convention ("use bd remember, not MEMORY.md";
# "push before done") that can conflict with the HANDOFF/MEMORY file convention
# and the confirm-before-push rule. Turn it on for a bd-native repo. Only
# session-orient injects it (PreCompact can't carry context forward).
BD_PRIME=off

# --- Statusline (statusline.sh) --------------------------------------------
# The statusline reads Claude Code's native statusline JSON (context_window,
# rate_limits, cost) — no `npx ccusage`, no node, no network. Runtime is jq +
# git alone. The 5h/7d rate-limit segments render only when Claude Code supplies
# those fields; otherwise they're silently omitted.

# Context-occupancy percent at which the statusline shows a "⚠ /wind-down" hint.
CTX_WINDDOWN_PCT="85"

# --- Lint on edit (auto-lint.sh) -------------------------------------------
# Command run against each edited source file (the file path is appended).
# The first word is the binary; the hook prefers a project venv copy of it
# (.venv/bin/<bin>, then .test.venv/bin/<bin>) before falling back to PATH.
# Examples: "ruff check --fix"  |  "eslint --fix"  |  "gofmt -w"
LINT_CMD='eslint --fix'
# Space-separated file extensions (no dots) the lint hook acts on.
# Examples: "py"  |  "ts tsx js jsx"  |  "go"
LINT_EXTS="ts tsx js mjs cjs"
