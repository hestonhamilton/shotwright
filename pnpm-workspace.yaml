# pnpm 11 no longer reads settings from the "pnpm" key in package.json — they
# live here now (https://pnpm.io/settings). The upgrade warned about exactly
# this, by name:
#
#   [WARN] The "pnpm" field in package.json is no longer read by pnpm.
#          The following keys were ignored: "pnpm.overrides"
#
# Had that warning been skimmed, both overrides below would have been silently
# dropped and the two advisories they fix (shotwright-746.23, ADR 0019) would
# have come back. The OSV gate is what catches that regression, which is the
# argument for having a gate rather than only pins.
overrides:
  # GHSA-rgw5-rvv9-x895 / CVE-2026-69152 — via eslint > minimatch. Raised to
  # 5.0.12 on 2026-10-05 for GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and
  # GHSA-q2hr-2g5m-vwhr (shotwright-746.18.20).
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  # GHSA-2883-xcg3-v3hh / CVE-2026-84375 — both major lines are present as
  # transitives (shotwright-746.18.20).
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  # GHSA-2v37-7h3g-55p8 / CVE-2026-67213 — via vite > postcss
  'nanoid@<3.3.18': ^3.3.18
  # GHSA-68fv-2mgg-jv7q / CVE-2026-93749 — via vite > postcss (shotwright-746.18.25)
  'source-map-js@<1.2.2': ^1.2.2
